# config.yaml - RFSI Master Thesis Pipeline
# Aligned with BSS and IDW structure
paths:
  input_root: "Kombiniert"
  dem: "DEM_Source/COP30_mosaic_EPSG31287.tif"
  output_root: "RFSI/Output"

domain:
  preset: "full"
  custom_bbox: [-76229, 123066, 637216, 501366]
  buffer_m: 15000

predefined_bboxes:
  # Alpine Convention perimeter in EPSG:31287 (from process_new_dem.py run)
  full: [-76229, 123066, 637216, 501366]

time_resolution: "monthly"
start_date: "2020-01-01"
end_date:   "2025-12-31"
resolutions_to_process: [1000]

rfsi:
  # pooled = one forest per variable (Sekulić et al. 2020)
  architecture: pooled
  n_obs: 10
  save_model: true
  variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]

  # 4 parameters, so the search is coordinate descent, not a full product.
  n_obs_list: [4, 8, 16, 32, 64]

  rf_fixed:
    n_estimators: 250
    random_state: 22
    min_samples_leaf: 5

  rf_tunable:
    max_depth: [10, 20, null]
    min_samples_leaf: [1, 5, 15]
    max_features: ["sqrt", 0.5, 1.0]

  use_elevation: true
  use_landcover: true
  landcover_path: ""
  landcover_encoding: "onehot"
  primary_metric: "rmse"

# Phase A controls
  n_opt_stations: 50           # subsample for search
  n_estimators_search: 100     # cheap RF during search

  # production controls (from the updated script)
  optimize_mode: "single"
  save_llocv: true
  predict_chunk_size: 250000
  fine_res_threshold: 200
  n_jobs_fine: 2
  n_jobs_coarse: -1

aggregation:
  weekly:
    freq: "W"
    time_col: "year_week"
  daily:
    freq: "D"
    time_col: "date"
  monthly:
    freq: "ME"
    time_col: "year_month"
  half_hourly:
    freq: "30min"
    time_col: "timestamp"
    add_is_daylight: true

targets:
  precipitation:
    raw_col: "precipitation"
    stats: ["sum"]
    output_names: ["precip_sum"]
  temperature:
    raw_col: "temperature"
    stats: ["mean", "min", "max"]
    output_names: ["temp_mean", "temp_min", "temp_max"]
  wind_speed:
    raw_col: "wind_speed"
    stats: ["mean", "max"]
    output_names: ["wind_mean", "wind_max"]
  relative_humidity:
    raw_col: "relative_humidity"
    stats: ["mean"]
    output_names: ["rh_mean"]
  snow_height:
    raw_col: "snow_height"
    stats: ["mean", "max", "min"]
    output_names: ["snow_mean", "snow_max", "snow_min"]

min_stations_per_field: 10
random_seed: 31
verbose: true
n_jobs: -1