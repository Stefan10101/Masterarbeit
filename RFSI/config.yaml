# RFSI. Covariates are the shared block; elev and clc are not a second switch.
domain:
  preset: full
time_resolution: monthly
start_date: "2020-01-01"
end_date: "2025-12-31"
resolutions_to_process: [500]
variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
min_stations_per_field: 10
overwrite_maps: true
aggregation:
  weekly:
    time_col: year_week
  daily:
    time_col: date
  monthly:
    time_col: year_month
  half_hourly:
    time_col: timestamp

rfsi:
  architecture: pooled
  n_obs: 10
  n_obs_list: [4, 8, 16, 32, 64]
  seed: 31
  n_regions: 6
  rh_t_mode: none
  two_step: true
  tau_wet: 0.5
  n_opt_stations: 50
  n_estimators_search: 100
  predict_chunk_size: 250000
  rf_fixed:
    n_estimators: 250
    random_state: 22
    min_samples_leaf: 5
  rf_tunable:
    max_depth: [10, 20, null]
    min_samples_leaf: [1, 5, 15]
    max_features: [sqrt, 0.5, 1.0]
covariates:
  elev: true
  smooth_elev: true
  slope: true
  northness: true
  tpi: true
  clc: true
  dist_to_coast: true
  signed_dist_to_ridge: true
  basin_continuity: true
  elev_above_valley: true
