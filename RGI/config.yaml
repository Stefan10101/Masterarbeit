# Residual graph interpolator.
domain:
  preset: full
time_resolution: monthly
start_date: "2020-01-01"
end_date: "2025-12-31"
resolutions_to_process: [1000]
variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
min_stations_per_field: 10
overwrite_maps: true
aggregation:
  weekly:
    time_col: year_week
  daily:
    time_col: date
  monthly:
    time_col: year_month
  half_hourly:
    time_col: timestamp

rgi:
  two_step: true
  tau_wet: 0.5
  rh_t_mode: predicted
  k: 10
  n_layers: 3
  alpha: 0.2
  alpha_z: 10.0
  hidden_dim: 64
  dropout: 0.1
  clc_embed_dim: 8
  epochs: 80
  patience: 12
  lr: 0.001
  weight_decay: 0.0001
  train_mask_frac: 0.25
  batch_times: 8
  seed: 22
  device: auto
  use_amp: true
  predict_tile: 120000
  n_folds: 5
  search:
    k: [4, 16, 32]
    n_layers: [2, 3, 4, 5]
    alpha: [0.1, 0.2]
    alpha_z: [10.0, 50.0, 200.0]
  search_expand:
    k: [4, 16, 32, 64]
    alpha: [0.1, 0.2]
    alpha_z: [50.0, 200.0]
covariates:
  elev: true
  smooth_elev: true
  slope: true
  northness: true
  tpi: true
  clc: true
  dist_to_coast: true
  signed_dist_to_ridge: true
  basin_continuity: true
  elev_above_valley: true
