# config.yaml - Residual Graph Interpolator
# Layout aligned with RFSI / IDW / BSS.
# Station and grid files are reused from RFSI so RGI needs no extra copies.

paths:
  input_root: "Kombiniert"
  dem: "DEM_Source/COP30_mosaic_EPSG31287.tif"
  output_root: "RGI/Output"
  aggregated_from: "RFSI"
  stations_from: "RFSI"
  grids_from: "RFSI"

domain:
  preset: "full"
  custom_bbox: [100000, 275000, 395000, 400000]
  buffer_m: 15000

predefined_bboxes:
  full:            [-60000, 200000, 460000, 620000]
  central_alps:    [120000, 260000, 340000, 420000]
  inn_valley:      [150000, 300000, 290000, 390000]
  rhine_valley:    [40000,  280000, 130000, 380000]
  etsch_valley:    [200000, 220000, 300000, 320000]
  northern_edge:   [80000,  350000, 380000, 480000]
  alpine_foreland: [80000,  380000, 400000, 500000]

time_resolution: "monthly"
start_date: "2020-01-01"
end_date:   "2025-12-31"
resolutions_to_process: [1000]

rgi:
  variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
  two_step: true
  tau_wet: 0.5
  rh_t_mode: "predicted"
  snow_terrain: true
  wind_tpi: true
  save_model: true
  save_llocv: true
  primary_metric: "rmse"

  # defaults used when no tuned yaml is present
  k: 10
  n_layers: 3
  alpha: 0.2          # initial-residual mix
  alpha_z: 10.0       # metres of elev ≈ alpha_z metres horizontal
  hidden_dim: 64
  dropout: 0.1
  clc_embed_dim: 8

  # training
  epochs: 80
  patience: 12
  lr: 0.001
  weight_decay: 0.0001
  train_mask_frac: 0.25   # extra random queries each timestamp (anti-copy)
  batch_times: 8
  seed: 22
  device: "auto"        # auto | cuda | cpu
  use_amp: true
  predict_tile: 120000  # grid cells per GNN call; raise if VRAM allows

  # DEV search (two-phase in tune_rgi.py)
  search:
    k: [5, 10, 20]
    n_layers: [2, 3, 4]
    alpha: [0.1, 0.2, 0.3]
    alpha_z: [0.0, 10.0, 50.0]
  # used by --phase 3 after the first grid hits a corner
  search_expand:
    k: [5, 10, 15, 20]
    alpha: [0.30, 0.40, 0.50, 0.60]
    alpha_z: [50.0, 100.0, 150.0, 200.0]
  n_folds: 5

aggregation:
  weekly:
    freq: "W"
    time_col: "year_week"
  daily:
    freq: "D"
    time_col: "date"
  monthly:
    freq: "ME"
    time_col: "year_month"
  half_hourly:
    freq: "30min"
    time_col: "timestamp"
    add_is_daylight: true

targets:
  precipitation:
    raw_col: "precipitation"
    stats: ["sum"]
    output_names: ["precip_sum"]
  temperature:
    raw_col: "temperature"
    stats: ["mean", "min", "max"]
    output_names: ["temp_mean", "temp_min", "temp_max"]
  wind_speed:
    raw_col: "wind_speed"
    stats: ["mean", "max"]
    output_names: ["wind_mean", "wind_max"]
  relative_humidity:
    raw_col: "relative_humidity"
    stats: ["mean"]
    output_names: ["rh_mean"]
  snow_height:
    raw_col: "snow_height"
    stats: ["mean", "max", "min"]
    output_names: ["snow_mean", "snow_max", "snow_min"]

min_stations_per_field: 10
random_seed: 31
verbose: true
n_jobs: -1
overwrite_maps: true
