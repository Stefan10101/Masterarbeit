# IDW. Paths and geometry live in paths.py and shared/grids/config.yaml.
domain:
  preset: full
time_resolution: monthly
start_date: "2020-01-01"
end_date: "2025-12-31"
resolutions_to_process: [500]
variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
min_stations_per_field: 10
overwrite_maps: true
aggregation:
  weekly:
    time_col: year_week
  daily:
    time_col: date
  monthly:
    time_col: year_month
  half_hourly:
    time_col: timestamp

idw:
  seed: 31

param_grid:
  power:
    # Full factorial: 5 x 5 x 6 = 150.
    p: [1.0, 1.5, 2.0, 3.0, 4.0]
    Fz: [0.0, 0.25, 0.5, 0.75, 1.0]
    k_neighbors: [4, 8, 16, 32, 64, 128]
