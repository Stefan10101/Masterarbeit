## config.yaml - IDW Master Thesis Pipeline

paths:
  input_root: "Kombiniert"
  dem: "DEM_Source/COP30_mosaic_EPSG31287.tif"
  output_root: "IDW/Output"

domain:
  preset: "full"
  custom_bbox: [100000, 275000, 395000, 400000]
  buffer_m: 15000

predefined_bboxes:
  # Full extent of the available DEM 
  full:            [-60000, 200000, 460000, 620000]

  # Major regions (more generous and better aligned)
  central_alps:    [120000, 260000, 340000, 420000]
  inn_valley:      [150000, 300000, 290000, 390000]
  rhine_valley:    [40000,  280000, 130000, 380000]
  etsch_valley:    [200000, 220000, 300000, 320000]
  northern_edge:   [80000,  350000, 380000, 480000]
  alpine_foreland: [80000,  380000, 400000, 500000]
time_resolution: "monthly"
start_date: "2020-01-01"
end_date:   "2025-12-31"

resolutions_to_process: [1000]
cluster_method: "gmm"

primary_metric: "rmse"

loocv:
  half_hourly_sample_n: 10
  half_hourly_param_aggregation: "median"

aggregation:
  weekly:
    freq: "W"
    time_col: "year_week"
  daily:
    freq: "D"
    time_col: "date"
  half_hourly:
    freq: "30min"
    time_col: "timestamp"
    add_is_daylight: true

targets:
  precipitation:
    raw_col: "precipitation"
    stats: ["sum"]
    output_names: ["precip_sum"]
  temperature:
    raw_col: "temperature"
    stats: ["mean", "min", "max"]
    output_names: ["temp_mean", "temp_min", "temp_max"]
  wind_speed:
    raw_col: "wind_speed"
    stats: ["mean", "max"]
    output_names: ["wind_mean", "wind_max"]
  relative_humidity:
    raw_col: "relative_humidity"
    stats: ["mean"]
    output_names: ["rh_mean"]
  snow_height:
    raw_col: "snow_height"
    stats: ["mean", "max", "min"]
    output_names: ["snow_mean", "snow_max", "snow_min"]

param_grid:
  power:
    p: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5]
    Fz: [0.0, 0.2, 0.4, 0.6, 0.8, 1]
    k_neighbors: [4, 6, 8, 10, 12, 16, 20, 24, 32, 40, 48]

min_stations_per_field: 10
random_seed: 31
verbose: true
n_jobs: -1

