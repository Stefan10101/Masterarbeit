# Frei 2014 / SPARTACUS-style interpolator (redesigned).
domain:
  preset: full
time_resolution: monthly
start_date: "2020-01-01"
end_date: "2025-12-31"
resolutions_to_process: [500]
variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
min_stations_per_field: 10
overwrite_maps: true
aggregation:
  weekly:
    time_col: year_week
  daily:
    time_col: date
  monthly:
    time_col: year_month
  half_hourly:
    time_col: timestamp

frei:
  n_regions: 6
  n_sections: 3
  shrink: 0.3
  blend_km: 15.0
  coldpool_tpi: -60.0
  accum_pct: 96.0
  k: 16
  power: 2.0
  Fz: 0.3
  across_w: 4.0
  select_metric: true
  two_step: true
  tau_wet: 0.5
  seed: 22
  n_folds: 5
  predict_tile: 20000
  compute:
    tune_mode: coord
    tune_months: seasonal4
    tune_folds: 5
    produce_splits: all
  search:
    n_regions: [3, 4, 6, 8, 12]
    n_sections: [1, 2, 3, 4, 5]
    shrink: [0.1, 0.3, 0.5, 0.8]
    across_w: [1.0, 2.0, 4.0, 8.0]
