# config.yaml - Frei 2014 / SPARTACUS-style interpolator
# Station and grid files are reused from RFSI.

paths:
  input_root: "Kombiniert"
  dem: "DEM_Source/COP30_mosaic_EPSG31287.tif"
  output_root: "Frei/Output"
  aggregated_from: "RFSI"
  stations_from: "RFSI"
  grids_from: "RFSI"

domain:
  preset: "full"
  custom_bbox: [100000, 275000, 395000, 400000]
  buffer_m: 15000

predefined_bboxes:
  full:            [-60000, 200000, 460000, 620000]
  central_alps:    [120000, 260000, 340000, 420000]
  inn_valley:      [150000, 300000, 290000, 390000]
  rhine_valley:    [40000,  280000, 130000, 380000]
  etsch_valley:    [200000, 220000, 300000, 320000]
  northern_edge:   [80000,  350000, 380000, 480000]
  alpine_foreland: [80000,  380000, 400000, 500000]

time_resolution: "monthly"
start_date: "2020-01-01"
end_date:   "2025-12-31"
resolutions_to_process: [1000]

frei:
  variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
  save_model: true
  save_llocv: true
  primary_metric: "rmse"

  profile: "spartacus3"
  n_regions: 6
  shrink: 0.3
  blend_km: 15.0
  summit_tpi: 80.0
  coldpool_tpi: -60.0
  accum_pct: 96.0

  k: 16
  power: 2.0
  across_w: 4.0
  select_metric: true
  lam_z: 150.0
  two_step: true
  tau_wet: 0.5

  # RH auxiliary T: none | predicted | observed
  # predicted = T from donor stations (fold-safe, same as maps)
  # observed  = query-station T (LLOCV oracle only; maps fall back to predicted)
  rh_t_mode: "predicted"
  snow_terrain: true
  wind_elev_bg: true

  seed: 22
  n_folds: 5
  predict_tile: 20000

  # Cheap default: coordinate descent on Feb/May/Aug/Nov of every year in the panel.
  # Full product search: set tune_mode: grid and tune_months: all.
  compute:
    tune_mode: "coord"
    tune_months: "seasonal4"
    tune_folds: 5
    produce_splits: "all"

  search:
    n_regions: [4, 6, 8, 12]
    shrink: [0.1, 0.3, 0.5]
    k: [8, 16, 32]
    across_w: [2.0, 4.0, 8.0]

aggregation:
  weekly:
    freq: "W"
    time_col: "year_week"
  daily:
    freq: "D"
    time_col: "date"
  monthly:
    freq: "ME"
    time_col: "year_month"
  half_hourly:
    freq: "30min"
    time_col: "timestamp"
    add_is_daylight: true

targets:
  precipitation:
    raw_col: "precipitation"
    stats: ["sum"]
    output_names: ["precip_sum"]
  temperature:
    raw_col: "temperature"
    stats: ["mean", "min", "max"]
    output_names: ["temp_mean", "temp_min", "temp_max"]
  wind_speed:
    raw_col: "wind_speed"
    stats: ["mean", "max"]
    output_names: ["wind_mean", "wind_max"]
  relative_humidity:
    raw_col: "relative_humidity"
    stats: ["mean"]
    output_names: ["rh_mean"]
  snow_height:
    raw_col: "snow_height"
    stats: ["mean", "max", "min"]
    output_names: ["snow_mean", "snow_max", "snow_min"]

min_stations_per_field: 10
random_seed: 31
verbose: true
n_jobs: -1
overwrite_maps: true
