# SMACNP. One variable per process; omit --variable to walk variables_to_process.
domain:
  preset: full
time_resolution: monthly
start_date: "2020-01-01"
end_date: "2025-12-31"
resolutions_to_process: [500]
variables_to_process:
  - precip_sum
  - temp_mean
  - temp_min
  - temp_max
  - wind_mean
  - wind_max
  - rh_mean
  - snow_mean
  - snow_max
  - snow_min
  - slr
  - slr_min
  - slr_max
  - swe
  - swe_min
  - swe_max
variable_parents:
  temp_min: temp_mean
  temp_max: temp_mean
  wind_max: wind_mean
  snow_max: snow_mean
  snow_min: snow_mean
  slr_min: slr
  slr_max: slr
  swe_min: swe
  swe_max: swe
overwrite_maps: true
aggregation:
  weekly:
    time_col: year_week
  daily:
    time_col: date
  monthly:
    time_col: year_month
  half_hourly:
    time_col: timestamp
smacnp:
  two_step_vars: ["precip_sum", "snow_mean"]
  snow_hard_gate: true
  r_dim: 64
  w_dim: 256
  v_dim: 512
  hidden_size: 512
  num_layers_mlp: 3
  num_heads: 8
  dropout_rate: 0.1
  use_layer_norm: false
  k_localized: 16
  use_positional_encoding: true
  pe_dim: 32
  variance_floor: 2.0e-4
  on_grid_training: true
  context_fraction: 0.5
  num_epochs: 500
  lr: 0.000419
  weight_decay: 1.0e-5
  clip_grad_norm: 1.0
  early_stopping_patience: 50
  use_amp: false
  seed: 42
  device: auto
  search:
    k_localized: [8, 16, 32, 64]
    hidden_size: [256, 512]
covariates:
  elev: true
  smooth_elev: true
  slope: true
  northness: true
  tpi: true
  clc: true
  dist_to_coast: true
  signed_dist_to_ridge: true
  basin_id: true
  elev_above_valley: true
