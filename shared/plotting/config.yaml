plotting:
  mode: folder_loop
  input_nc_folder: "C:\\Users\\stefa\\Documents\\UNI\\Master\\Masterarbeit\\Daten\\Methods"   # parent of all method Output folders
  domain: "full"
  time_resolution: "monthly"
  resolutions: [500]          # or [500] if you actually produced 500 m grids
  time_period: "20200101-20251231"
  variables: [temp_mean, precip_sum, wind_mean, rh_mean, snow_mean,]
  output_root: null
  dpi: 250
  scatter_dpi: 300
  default_variables:
    - precip_sum
    - temp_mean
    - temp_min
    - temp_max
    - wind_mean
    - wind_max
    - rh_mean
    - snow_mean
    - snow_max
    - snow_min

maps:
  show_stations: false
  show_provider_symbols: false
  show_topo: true
  show_extra_info: true
  dpi: 250
  n_jobs: -1

  time_filter:
    step: 1
    months: null
    weeks: null
    years: null
    timestamps: null

    
  colormaps:
    temp_mean: "RdBu_r"
    temp_min: "RdBu_r"
    temp_max: "RdBu_r"
    precip_sum: "Blues"
    snow_mean: "BuPu"
    snow_max: "BuPu"
    snow_min: "BuPu"
    rh_mean: "viridis"
    wind_mean: "viridis"
    wind_max: "viridis"
    default: "viridis"