# config.yaml - Kriging (linear RK + OK control)
# Station and grid files are reused from RFSI.

paths:
  input_root: "Kombiniert"
  dem: "DEM_Source/COP30_mosaic_EPSG31287.tif"
  output_root: "Kriging/Output"
  aggregated_from: "RFSI"
  stations_from: "RFSI"
  grids_from: "RFSI"

domain:
  preset: "full"
  custom_bbox: [-76229, 123066, 637216, 501366]
  buffer_m: 15000

predefined_bboxes:
  # Alpine Convention perimeter in EPSG:31287 (from process_new_dem.py run)
  full: [-76229, 123066, 637216, 501366]

time_resolution: "monthly"
start_date: "2020-01-01"
end_date:   "2025-12-31"
resolutions_to_process: [1000]

kriging:
  variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
  save_model: true
  save_llocv: true
  primary_metric: "rmse"

  # frozen defaults used when no tuned yaml is present
  trend: "linear"            # none = OK control, linear = RK
  interactions: "both"       # none | elev_xy | elev_clc | both
  family: "exponential"
  k: 16
  k_indicator: 16
  theta_deg: 0.0
  aniso_ratio: 1.0
  alpha_z: 0.0
  min_clc_count: 15
  min_pairs: 200
  n_lags: 12
  predict_tile: 8000
  seed: 22
  n_folds: 5
  tau_wet: 0.5
  rh_t_mode: "predicted"
  snow_terrain: true
  wind_watershed: true
  across_w: 4.0
  per_timestamp_vgm: true          # fit γ from current donors at predict time; fallback to stored
  n_regions: 6
  compute:
    tune_months: "seasonal4"
    tune_folds: 5
    tune_phase: "1"
    produce_splits: "all"

  regimes_from: "RFSI"
  cluster_method: "gmm"

  # two-step (Q17 D): present if value > trace. precip in mm, snow in cm
  trace_mm:
    half_hourly: 0.05
    daily: 0.1
    weekly: 0.7
    monthly: 1.0
    seasonal: 3.0
  trace_snow:
    half_hourly: 0.5
    daily: 0.5
    weekly: 1.0
    monthly: 1.0
    seasonal: 2.0

  # staged search. More than 3 interacting params, so phases stay.
  # k and alpha_z use the shared wider levels.
  search:
    k: [4, 8, 16, 32, 64, 128]
    family: ["spherical", "exponential", "matern15", "gaussian"]
    theta_deg: [0.0, 45.0, 90.0]
    aniso_ratio: [1.0, 0.5, 0.3]
    alpha_z: [1.0, 10.0, 50.0, 200.0, 500.0, 1000.0]
    interactions: ["none", "elev_xy", "elev_clc", "both"]
  search_expand:
    alpha_z: [1.0, 10.0, 50.0, 200.0, 500.0, 1000.0]
    k: [4, 8, 16, 32, 64, 128]

aggregation:
  weekly:
    freq: "W"
    time_col: "year_week"
  daily:
    freq: "D"
    time_col: "date"
  monthly:
    freq: "ME"
    time_col: "year_month"
  half_hourly:
    freq: "30min"
    time_col: "timestamp"
    add_is_daylight: true

targets:
  precipitation:
    raw_col: "precipitation"
    stats: ["sum"]
    output_names: ["precip_sum"]
  temperature:
    raw_col: "temperature"
    stats: ["mean", "min", "max"]
    output_names: ["temp_mean", "temp_min", "temp_max"]
  wind_speed:
    raw_col: "wind_speed"
    stats: ["mean", "max"]
    output_names: ["wind_mean", "wind_max"]
  relative_humidity:
    raw_col: "relative_humidity"
    stats: ["mean"]
    output_names: ["rh_mean"]
  snow_height:
    raw_col: "snow_height"
    stats: ["mean", "max", "min"]
    output_names: ["snow_mean", "snow_max", "snow_min"]

min_stations_per_field: 10
random_seed: 31
verbose: true
n_jobs: -1
overwrite_maps: true
