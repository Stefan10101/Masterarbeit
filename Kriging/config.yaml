# Kriging (linear RK + OK control).
domain:
  preset: full
time_resolution: monthly
start_date: "2020-01-01"
end_date: "2025-12-31"
resolutions_to_process: [500]
variables_to_process:
  - precip_sum
  - temp_mean
  - temp_min
  - temp_max
  - wind_mean
  - wind_max
  - rh_mean
  - snow_mean
  - snow_max
  - snow_min
  - slr
  - slr_min
  - slr_max
  - swe
  - swe_min
  - swe_max
variable_parents:
  temp_min: temp_mean
  temp_max: temp_mean
  wind_max: wind_mean
  snow_max: snow_mean
  snow_min: snow_mean
  slr_min: slr
  slr_max: slr
  swe_min: swe
  swe_max: swe
min_stations_per_field: 10
overwrite_maps: false
aggregation:
  weekly:
    time_col: year_week
  daily:
    time_col: date
  monthly:
    time_col: year_month
  half_hourly:
    time_col: timestamp

kriging:
  trend: linear
  interactions: both
  family: exponential
  k: 16
  k_indicator: 16
  theta_deg: 0.0
  aniso_ratio: 1.0
  alpha_z: 0.0
  min_clc_count: 15
  min_pairs: 200
  n_lags: 12
  predict_tile: 8000
  seed: 22
  n_folds: 5
  tau_wet: 0.5
  rh_t_mode: predicted
  snow_terrain: true
  wind_watershed: true
  across_w: 4.0
  per_timestamp_vgm: true
  n_regions: 11
  compute:
    tune_months: seasonal4
    tune_folds: 5
    tune_phase: all
    produce_splits: all
    jobs: n-1
  trace_mm:
    half_hourly: 0.05
    daily: 0.1
    weekly: 0.7
    monthly: 1.0
    seasonal: 3.0
  trace_snow:
    half_hourly: 0.5
    daily: 0.5
    weekly: 1.0
    monthly: 1.0
    seasonal: 2.0
  search:
    # One factorial, same for every variable: k x family x alpha_z = 16.
    # k matches the neighbourhood sizes used by the other methods.
    # Locked: interactions=both, k_indicator=k, isotropic. One aniso check after.
    k: [ 16, 32, 64]
    family: [exponential, spherical]
    alpha_z: [50.0, 200.0]
    aniso_check:
      aniso_ratio: 0.5
      theta_deg: 45.0

covariates:
  elev: true
  smooth_elev: true
  slope: true
  northness: true
  tpi: true
  clc: true
  dist_to_coast: true
  signed_dist_to_ridge: true
  basin_id: true
  elev_above_valley: true
