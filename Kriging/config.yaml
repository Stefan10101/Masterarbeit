# Kriging (linear RK + OK control).
domain:
  preset: full
time_resolution: monthly
start_date: "2020-01-01"
end_date: "2025-12-31"
resolutions_to_process: [500]
variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
min_stations_per_field: 10
overwrite_maps: false
aggregation:
  weekly:
    time_col: year_week
  daily:
    time_col: date
  monthly:
    time_col: year_month
  half_hourly:
    time_col: timestamp

kriging:
  trend: linear
  interactions: both
  family: exponential
  k: 16
  k_indicator: 16
  theta_deg: 0.0
  aniso_ratio: 1.0
  alpha_z: 0.0
  min_clc_count: 15
  min_pairs: 200
  n_lags: 12
  predict_tile: 8000
  seed: 22
  n_folds: 5
  tau_wet: 0.5
  rh_t_mode: predicted
  snow_terrain: true
  wind_watershed: true
  across_w: 4.0
  per_timestamp_vgm: true
  n_regions: 6
  compute:
    tune_months: seasonal4
    tune_folds: 5
    tune_phase: all
    produce_splits: all
  trace_mm:
    half_hourly: 0.05
    daily: 0.1
    weekly: 0.7
    monthly: 1.0
    seasonal: 3.0
  trace_snow:
    half_hourly: 0.5
    daily: 0.5
    weekly: 1.0
    monthly: 1.0
    seasonal: 2.0
  search:
    k: [4, 8, 16, 32, 64, 128]
    family: [spherical, exponential, matern15, gaussian]
    theta_deg: [0.0, 45.0, 90.0]
    aniso_ratio: [1.0, 0.5, 0.3]
    alpha_z: [1.0, 10.0, 50.0, 200.0, 500.0, 1000.0]
    interactions: [none, elev_xy, elev_clc, both]
  search_expand:
    alpha_z: [1.0, 10.0, 50.0, 200.0, 500.0, 1000.0]
    k: [4, 8, 16, 32, 64, 128]
covariates:
  elev: true
  smooth_elev: true
  slope: true
  northness: true
  tpi: true
  clc: true
  dist_to_coast: true
  signed_dist_to_ridge: true
  basin_continuity: true
  elev_above_valley: true
