# Raster U-Net interpolator.
domain:
  preset: full
time_resolution: monthly
start_date: "2020-01-01"
end_date: "2025-12-31"
resolutions_to_process: [1000]
variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
min_stations_per_field: 10
overwrite_maps: true
aggregation:
  weekly:
    time_col: year_week
  daily:
    time_col: date
  monthly:
    time_col: year_month
  half_hourly:
    time_col: timestamp

cnn:
  rh_t_mode: none
  n_levels: 4
  base_ch: 32
  residual_idw: true
  idw_k: 8
  gate_d0_km: 35
  use_terrain: true
  cyclic_time: true
  two_step: true
  tau_wet: 0.5
  train_mask_frac: 0.40
  epochs: 40
  patience: 8
  lr: 0.001
  weight_decay: 0.0001
  batch_times: 2
  tile_size: 128
  tiles_per_batch: 8
  accum_steps: 4
  seed: 22
  device: auto
  use_amp: false
  n_folds: 5
  search:
    n_levels: [2, 3, 4, 5]
    base_ch: [16, 32, 64]
covariates:
  elev: true
  smooth_elev: true
  slope: true
  northness: true
  tpi: true
  clc: true
  dist_to_coast: true
  signed_dist_to_ridge: true
  basin_continuity: true
  elev_above_valley: true
