# config.yaml - raster U-Net interpolator
# Station and grid files are reused from RFSI.

paths:
  input_root: "Kombiniert"
  dem: "DEM_Source/COP30_mosaic_EPSG31287.tif"
  output_root: "CNN/Output"
  aggregated_from: "RFSI"
  stations_from: "RFSI"
  grids_from: "RFSI"

domain:
  preset: "full"
  custom_bbox: [-53065, 211149, 420782, 593933]
  buffer_m: 15000

predefined_bboxes:
  # Study domain (lonlat 7.5–13.6 E, 45.8–49.1 N) in EPSG:31287
  full: [-53065, 211149, 420782, 593933]

time_resolution: "monthly"
start_date: "2020-01-01"
end_date:   "2025-12-31"
resolutions_to_process: [1000]

cnn:
  variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
  rh_t_mode: "none"
  save_model: true
  save_llocv: true
  primary_metric: "rmse"

  n_levels: 4
  base_ch: 32
  residual_idw: true
  idw_k: 8
  use_terrain: true
  cyclic_time: true
  two_step: true
  tau_wet: 0.5
  train_mask_frac: 0.40
  epochs: 40
  patience: 8
  lr: 0.001
  weight_decay: 0.0001
  batch_times: 4
  seed: 22
  device: "auto"
  use_amp: true
  n_folds: 5

  search:
    n_levels: [3, 4, 5]
    base_ch: [16, 32, 64]
    train_mask_frac: [0.15, 0.25, 0.35]
    tau_wet: [0.4, 0.5, 0.6]

aggregation:
  weekly:
    freq: "W"
    time_col: "year_week"
  daily:
    freq: "D"
    time_col: "date"
  monthly:
    freq: "ME"
    time_col: "year_month"
  half_hourly:
    freq: "30min"
    time_col: "timestamp"
    add_is_daylight: true

targets:
  precipitation:
    raw_col: "precipitation"
    stats: ["sum"]
    output_names: ["precip_sum"]
  temperature:
    raw_col: "temperature"
    stats: ["mean", "min", "max"]
    output_names: ["temp_mean", "temp_min", "temp_max"]
  wind_speed:
    raw_col: "wind_speed"
    stats: ["mean", "max"]
    output_names: ["wind_mean", "wind_max"]
  relative_humidity:
    raw_col: "relative_humidity"
    stats: ["mean"]
    output_names: ["rh_mean"]
  snow_height:
    raw_col: "snow_height"
    stats: ["mean", "max", "min"]
    output_names: ["snow_mean", "snow_max", "snow_min"]

min_stations_per_field: 10
random_seed: 31
verbose: true
n_jobs: -1
overwrite_maps: true
