# config.yaml - 3D thin-plate spline / E-OBS protocol
# Station and grid files are reused from RFSI.

paths:
  input_root: "Kombiniert"
  dem: "DEM_Source/COP30_mosaic_EPSG31287.tif"
  output_root: "TPS/Output"
  aggregated_from: "RFSI"
  stations_from: "RFSI"
  grids_from: "RFSI"

domain:
  preset: "full"
  custom_bbox: [100000, 275000, 395000, 400000]
  buffer_m: 15000

predefined_bboxes:
  full:            [-60000, 200000, 460000, 620000]
  central_alps:    [120000, 260000, 340000, 420000]
  inn_valley:      [150000, 300000, 290000, 390000]
  rhine_valley:    [40000,  280000, 130000, 380000]
  etsch_valley:    [200000, 220000, 300000, 320000]
  northern_edge:   [80000,  350000, 380000, 480000]
  alpine_foreland: [80000,  380000, 400000, 500000]

time_resolution: "monthly"
start_date: "2020-01-01"
end_date:   "2025-12-31"
resolutions_to_process: [1000]

tps:
  variables_to_process: ["temp_mean"]
  save_model: true
  save_llocv: true
  primary_metric: "rmse"

  protocol: "eobs"
  kernel: "3d"

  lam: 1.0
  alpha_z: 100.0
  alpha_z_mode: "global"
  n_regions: 6
  nugget: 1.0e-6

  k: 32
  family: "exponential"
  k_indicator: 16
  tau_wet: 0.5

  seed: 22
  n_folds: 5
  predict_tile: 20000

  search:
    protocol: ["eobs", "tps"]
    kernel: ["3d", "partial"]
    lam: [0.1, 1.0, 10.0]
    alpha_z: [50.0, 100.0, 200.0]
    alpha_z_mode: ["global", "watershed"]
    n_regions: [4, 6, 8]

aggregation:
  weekly:
    freq: "W"
    time_col: "year_week"
  daily:
    freq: "D"
    time_col: "date"
  monthly:
    freq: "ME"
    time_col: "year_month"
  half_hourly:
    freq: "30min"
    time_col: "timestamp"
    add_is_daylight: true

targets:
  precipitation:
    raw_col: "precipitation"
    stats: ["sum"]
    output_names: ["precip_sum"]
  temperature:
    raw_col: "temperature"
    stats: ["mean", "min", "max"]
    output_names: ["temp_mean", "temp_min", "temp_max"]
  wind_speed:
    raw_col: "wind_speed"
    stats: ["mean", "max"]
    output_names: ["wind_mean", "wind_max"]
  relative_humidity:
    raw_col: "relative_humidity"
    stats: ["mean"]
    output_names: ["rh_mean"]
  snow_height:
    raw_col: "snow_height"
    stats: ["mean", "max", "min"]
    output_names: ["snow_mean", "snow_max", "snow_min"]

min_stations_per_field: 10
random_seed: 31
verbose: true
n_jobs: -1
overwrite_maps: true
