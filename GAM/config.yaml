# Additive / tensor GAM.
domain:
  preset: full
time_resolution: monthly
start_date: "2020-01-01"
end_date: "2025-12-31"
resolutions_to_process: [500]
variables_to_process: ["temp_mean", "precip_sum", "wind_mean", "rh_mean", "snow_mean"]
min_stations_per_field: 10
overwrite_maps: true
aggregation:
  weekly:
    time_col: year_week
  daily:
    time_col: date
  monthly:
    time_col: year_month
  half_hourly:
    time_col: timestamp

gam:
  formula: te_xy_s_elev
  n_splines: 10
  spline_order: 3
  use_clc: true
  use_terrain: true
  min_clc_count: 15
  two_step: true
  tau_wet: 0.5
  rscript: Rscript
  fit_r: fit_gam.R
  seed: 22
  n_folds: 5
  predict_tile: 50000
  r_timeout: 3600
  rh_t_mode: predicted
  wind_watershed: true
  n_regions: 6
  compute:
    tune_months: seasonal4
    tune_folds: 5
  search:
    formula:
      - te_xy_s_elev
      - te_xy_ti_elev
      - te_xyelev
      - s_xy_s_elev
    n_splines: [6, 8, 10, 14]
    n_splines_tensor: [6, 8, 10]
    tensor_formulas: [te_xyelev, te_xy_ti_elev]
    tau_wet: [0.3, 0.5, 0.7]
covariates:
  elev: true
  smooth_elev: true
  slope: true
  northness: true
  tpi: true
  clc: true
  dist_to_coast: true
  signed_dist_to_ridge: true
  basin_continuity: true
  elev_above_valley: true
