# Additive / tensor GAM.
domain:
  preset: full
time_resolution: monthly
start_date: "2020-01-01"
end_date: "2025-12-31"
resolutions_to_process: [500]
variables_to_process:
  - precip_sum
  - temp_mean
  - temp_min
  - temp_max
  - wind_mean
  - wind_max
  - rh_mean
  - snow_mean
  - snow_max
  - snow_min
  - slr
  - swe
variable_parents:
  temp_min: temp_mean
  temp_max: temp_mean
  wind_max: wind_mean
  snow_max: snow_mean
  snow_min: snow_mean
min_stations_per_field: 10
overwrite_maps: true
aggregation:
  weekly:
    time_col: year_week
  daily:
    time_col: date
  monthly:
    time_col: year_month
  half_hourly:
    time_col: timestamp

gam:
  formula: te_xy_s_elev
  n_splines: 10
  spline_order: 3
  use_clc: true
  use_terrain: true
  min_clc_count: 15
  two_step: true
  tau_wet: 0.5
  rscript: Rscript
  fit_r: fit_gam.R
  seed: 22
  n_folds: 5
  predict_tile: 50000
  r_timeout: 900   # 15 min; a hanging te_xyelev must not burn an hour per timestamp
  rh_t_mode: predicted
  wind_watershed: false   # wind uses the same single-fit path as other variables
  n_regions: 11
  compute:
    tune_months: seasonal4
    tune_folds: 5
  search:
    formula:
      - te_xy_s_elev
      - te_xy_ti_elev
      - te_xyelev
    n_splines: [8, 10]
    n_splines_tensor: [8, 10]
    tensor_formulas: [te_xyelev, te_xy_ti_elev]
covariates:
  elev: true
  smooth_elev: true
  slope: true
  northness: true
  tpi: true
  clc: true
  dist_to_coast: true
  signed_dist_to_ridge: true
  basin_id: true
  elev_above_valley: true
