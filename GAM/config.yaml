# config.yaml - additive / tensor GAM
# Station and grid files are reused from RFSI.

paths:
  input_root: "Kombiniert"
  dem: "DEM_Source/COP30_mosaic_EPSG31287.tif"
  output_root: "GAM/Output"
  aggregated_from: "RFSI"
  stations_from: "RFSI"
  grids_from: "RFSI"

domain:
  preset: "full"
  custom_bbox: [100000, 275000, 395000, 400000]
  buffer_m: 15000

predefined_bboxes:
  full:            [-60000, 200000, 460000, 620000]
  central_alps:    [120000, 260000, 340000, 420000]
  inn_valley:      [150000, 300000, 290000, 390000]
  rhine_valley:    [40000,  280000, 130000, 380000]
  etsch_valley:    [200000, 220000, 300000, 320000]
  northern_edge:   [80000,  350000, 380000, 480000]
  alpine_foreland: [80000,  380000, 400000, 500000]

time_resolution: "monthly"
start_date: "2020-01-01"
end_date:   "2025-12-31"
resolutions_to_process: [1000]

gam:
  variables_to_process: ["temp_mean", "precip_sum"]
  save_model: true
  save_llocv: true
  primary_metric: "rmse"

  # mode A: refit every timestamp. solver: mgcv via R, numpy fallback
  formula: "te_xy_s_elev"
  n_splines: 10
  spline_order: 3
  use_clc: true
  use_terrain: true
  min_clc_count: 15
  two_step: true
  tau_wet: 0.5
  rscript: "Rscript"
  fit_r: "fit_gam.R"

  seed: 22
  n_folds: 5
  predict_tile: 50000
  r_timeout: 600

  search:
    formula:
      - "te_xy_s_elev"
      - "te_xy_ti_elev"
      - "te_xyelev"
    n_splines: [8, 10]
    tau_wet: [0.4, 0.5, 0.6]

aggregation:
  weekly:
    freq: "W"
    time_col: "year_week"
  daily:
    freq: "D"
    time_col: "date"
  monthly:
    freq: "ME"
    time_col: "year_month"
  half_hourly:
    freq: "30min"
    time_col: "timestamp"
    add_is_daylight: true

targets:
  precipitation:
    raw_col: "precipitation"
    stats: ["sum"]
    output_names: ["precip_sum"]
  temperature:
    raw_col: "temperature"
    stats: ["mean", "min", "max"]
    output_names: ["temp_mean", "temp_min", "temp_max"]
  wind_speed:
    raw_col: "wind_speed"
    stats: ["mean", "max"]
    output_names: ["wind_mean", "wind_max"]
  relative_humidity:
    raw_col: "relative_humidity"
    stats: ["mean"]
    output_names: ["rh_mean"]
  snow_height:
    raw_col: "snow_height"
    stats: ["mean", "max", "min"]
    output_names: ["snow_mean", "snow_max", "snow_min"]

min_stations_per_field: 10
random_seed: 31
verbose: true
n_jobs: -1
overwrite_maps: true
