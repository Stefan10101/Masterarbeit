# config.yaml - BSS / BSSE Master Thesis Pipeline
# Clean, standalone configuration

paths:
  input_root: "Kombiniert"                    # location of raw/30min data and metadata (if needed)
  dem: "DEM_Source/COP30_mosaic_EPSG31287.tif"
  output_root: "BSS/Output"                   # all BSS results go here

domain:
  preset: "full"
  custom_bbox: [-76229, 123066, 637216, 501366]
  buffer_m: 15000

predefined_bboxes:
  # Alpine Convention perimeter in EPSG:31287 (from process_new_dem.py run)
  full: [-76229, 123066, 637216, 501366]
time_resolution: "monthly"
start_date: "2020-01-01"
end_date:   "2025-12-31"

resolutions_to_process: [1000]
cluster_method: "gmm"

bss:
  method: "bsse"                              # "bss" or "bsse"
  # elev scaled to km in bss_core (ELEV_SCALE=1000). Retrain cluster params.
  segment_min: 4
  segment_max: 18
  segment_step: 2
  tau_d_search: [0.0, 0.05, 0.1, 0.2, 0.4, 0.6, 0.8]
  tau_e_search: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9]
  non_negative_vars:
    - precip_sum
    - snow_mean
    - snow_max
    - snow_min
    - rh_mean
    - wind_mean
    - wind_max
  gcv_diagnostic: "gcv"

primary_validation: "gcv"
loocv:
  enable: true
  sample_n: 5
  half_hourly_sample_n: 5

overwrite_maps: true

aggregation:
  weekly:
    freq: "W"
    time_col: "year_week"
  daily:
    freq: "D"
    time_col: "date"
  half_hourly:
    freq: "30min"
    time_col: "timestamp"
    add_is_daylight: true
  monthly:
    freq: "ME"
    time_col: "year_month"
targets:
  precipitation:
    raw_col: "precipitation"
    stats: ["sum"]
    output_names: ["precip_sum"]
  temperature:
    raw_col: "temperature"
    stats: ["mean", "min", "max"]
    output_names: ["temp_mean", "temp_min", "temp_max"]
  wind_speed:
    raw_col: "wind_speed"
    stats: ["mean", "max"]
    output_names: ["wind_mean", "wind_max"]
  relative_humidity:
    raw_col: "relative_humidity"
    stats: ["mean"]
    output_names: ["rh_mean"]
  snow_height:
    raw_col: "snow_height"
    stats: ["mean", "max", "min"]
    output_names: ["snow_mean", "snow_max", "snow_min"]

min_stations_per_field: 10
random_seed: 31
verbose: true
n_jobs: -1